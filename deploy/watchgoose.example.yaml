# watchgoose configuration.
#
# Installed to /etc/watchgoose.yaml. Every duration is a Go duration string
# ("20m", "90s"). Anything omitted falls back to the built-in default shown
# here, so this file only needs to state what differs. The active values below
# show every setting; replace the two required empty values before installing.

server:
  # Bind to a private or tailnet address rather than 0.0.0.0. The endpoint is
  # unauthenticated; use network policy to limit who can reach it (ADR 0006).
  # Example: listen: "100.101.102.103:9099"  # replace with this VM's address
  listen: "" # required
  # How often the daemon re-evaluates whether reassurance has gone stale.
  poll_interval: 1m
  # Persisted to disk rather than kept in memory, so a crash and respawn is
  # not mistaken for silence.
  state_file: /srv/watchgoose/var/last-reassurance

reassurance:
  # The route the client POSTs to. The body is ignored: the arrival is the
  # entire signal. There is no signature to verify and no clock agreement
  # with the client, because the deadline is measured from local receipt time.
  path: /reassure
  # How long without reassurance before the machine concludes it is
  # unreachable. Keep this comfortably above the client's poke interval so
  # that one missed poke is never mistaken for silence.
  deadline: 20m

guard:
  # Boot-loop protection. Read from /proc/uptime and deliberately not
  # persisted, which is why re-arming on every boot costs no state.
  min_uptime: 30m

volume:
  # The data disk holding the ordinary home directories. Repair of those
  # accounts is skipped when this is not a mountpoint, because writes there
  # would land on the root disk and be shadowed on a later boot.
  # Example for homes on a separate volume: mountpoint: /home
  mountpoint: "" # empty when homes are on the root disk

repair:
  # Pause after repairing, before the first reboot attempt.
  settle: 1m
  # Ordinary accounts, repaired only when the volume is present.
  # Example: accounts: [alice, bob]
  accounts: [] # empty when only the recovery user needs repair
  # Public keys written to the recovery user, and to each account above when
  # the volume is present. These are public keys, not secrets.
  # Examples of the list shape; replace the placeholder key data with the full
  # contents of your own .pub files. These commented keys are not usable keys.
  # authorized_keys:
  #   - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... alice@laptop"
  #   - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA... bob@desktop"
  authorized_keys: [] # required: add at least one real public key
  # The standing account whose credentials live on the root disk. Its home
  # must stay outside volume.mountpoint.
  recovery_user: recovery
  recovery_home: /srv/recovery
  recovery_nopasswd_sudo: true

reboot:
  # How long to wait for a graceful reboot before escalating. The forceful
  # rung is intentionally not configurable; see
  # docs/adr/0002-escalate-to-sysrq-b.md.
  graceful_timeout: 5m

log:
  # Persistent audit log on the root disk, independent of the journal.
  log_file: /srv/watchgoose/var/watchgoose.log
